[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-foundry"
version = "0.1.0"
description = "Local-first, source-grounded knowledge workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
discovery = ["yt-dlp>=2024.10.22"]
ui = ["streamlit>=1.40,<2"]

[project.scripts]
kforge = "kforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
